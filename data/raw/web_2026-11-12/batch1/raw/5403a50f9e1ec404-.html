  <script>
    // URL Scheme으로 도서관 앱에 접근 시 그 파라미터를 읽어내 로직을 구현한다
    // 스토리지에 저장된 내용으로 GlobalController에서 상세 프로세스 구현
    function handleOpenURL(url) {
      var strValue = url;
      if (strValue.startsWith("hyulibapp://")) {
        var params = strValue.replace('hyulibapp://', '');
        var type = params.substring(0, params.indexOf("?"));
        var branch = params.split("branchId=")[1].charAt(0);
        if (type == "hold") {
          if (branch == "1") {
            window.location.href = "https://lib.hanyang.ac.kr/mylibrary/hold/holds";
          } else {
            window.location.href = "https://information.hanyang.ac.kr/mylibrary/hold/holds";
          }
        } else if (type == "charge") {
          if (branch == "1") {
            window.location.href = "https://lib.hanyang.ac.kr/mylibrary/charge/charges";
          } else {
            window.location.href = "https://information.hanyang.ac.kr/mylibrary/charge/charges";
          }
        }
      }
      if (strValue.indexOf("hyulibapp://sso") > -1) {
        strValue = strValue.replace('hyulibapp://sso', '');
        if (strValue.length > 0) {
          strValue = strValue.replace('?', '');
          if (strValue.indexOf("&") > -1) {
            var strArray = strValue.split("&");
            for (var i = 0; i < strArray.length; i++) {
              var paramDataArr = strArray[i].split("=");
              window.localStorage.setItem(paramDataArr[0], decodeURIComponent(paramDataArr[1]));
            }
          } else {
            var strArray = strValue.split("=");
            window.localStorage.setItem(strArray[0], decodeURIComponent(strArray[1]));
          }
        }
      }
    }

    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-VLS8DCGHMG", {
      send_page_view: false
    });

    gtag("event", "page_view", {
      page_title: document.title,
      page_location: window.location.href,
      page_path: window.location.pathname + window.location.hash
    });

    window.addEventListener("hashchange", function() {
      gtag("event", "page_view", {
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.hash
      });
    });
  </script>
