name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Sources/frontend/**"
      - ".github/workflows/azure-static-web-apps-calm-ground-0036c6b00.yml"
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify secrets
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_0036C6B00 }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ] && [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_BASE_URL / VITE_API_URL kosong."
            exit 1
          fi
          echo "SWA_TOKEN length: ${#SWA_TOKEN}"
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_0036C6B00 kosong."
            exit 1
          fi

      - name: Install and Build Frontend
        working-directory: Sources/frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_0036C6B00 }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy Sources/frontend/dist \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --env production
