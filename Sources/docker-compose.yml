# HYU Compass local infrastructure: MongoDB (documents, chunks, traces) and
# Qdrant (vectors). Both bind to 127.0.0.1 only and persist to named volumes.
#
#   docker compose up -d      # start
#   docker compose ps         # status
#   docker compose down       # stop (volumes are kept)
#
# `docker compose down -v` deletes the volumes and therefore all local data.
# Credentials come from the project-level .env file (see .env.example).

name: hyu-compass

services:
  mongodb:
    image: mongo:8.0.32
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongodb_data:
  qdrant_data:
