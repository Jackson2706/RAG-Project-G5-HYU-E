# HYU suite (P8): every method on the frozen HYU labels (Sources/data/HYU/labels/{dev,test}.jsonl).
# Retrieval stays as each preset defines it; generation uses one backbone for all (PLAYBOOK "Generation backbone").
index: null                  # null = settings.hyu_index_id (the published HYU index)
generation: {model: "qwen3.5:4b", temperature: 0.0, seed: 42, thinking: "off"}
presets: [B0_BASIC_DENSE_RAG, R5_HYBRID_CROSS_ENCODER, R9S_SCOPE_PREFILTER, R15_SELF_QUERY, R16_PROMPTED_CONDITIONAL,
          G0_CLOSED_BOOK, G1_ORACLE_CONTEXT, A0_AAES, A1_AAES_HARD_FILTER, A2_AAES_ORACLE_PROFILE, A3_AAES_ALWAYS_CLARIFY, A4_QUESTION_ONLY_AMBIGUITY, A6_AAES_NO_TEMPORAL]
dev_only_presets: [A0b_AAES_SPEC_FIXED]  # A34 optional, exploratory: dev split only (the runner ignores it for test)
# Pre-registered comparisons (Holm-corrected).
ours: A0_AAES
baselines: [B0_BASIC_DENSE_RAG, R5_HYBRID_CROSS_ENCODER, R15_SELF_QUERY, R16_PROMPTED_CONDITIONAL]
best_baseline: R15_SELF_QUERY  # G5: lowest dev AER among {B0, R5, R15, R16} in dev-02 (0.000)
ablation: A4_QUESTION_ONLY_AMBIGUITY   # comparison 3: A0 vs A4 on action macro-F1
bootstrap_resamples: 10000
smoke_cases: 5
